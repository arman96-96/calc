name: Build Android APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04  # استفاده از نسخه 22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk
          pip install buildozer
      
      - name: Build
        run: |
          # Create simple app if no main.py exists
          if [ ! -f main.py ]; then
            echo "from kivy.app import App
          from kivy.uix.button import Button
          
          class MyApp(App):
              def build(self):
                  return Button(text='Hello World!')
          
          MyApp().run()" > main.py
          fi
          
          # Create buildozer.spec
          cat > buildozer.spec << 'EOF'
[app]
title = MyApp
package.name = myapp
package.domain = org.example
version = 0.1
requirements = python3==3.9.0,kivy==2.2.1
android.api = 31
android.ndk = 23b

[buildozer]
log_level = 2
EOF
          
          buildozer android debug
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
