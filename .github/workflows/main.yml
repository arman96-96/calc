name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake \
            libffi-dev libssl-dev \
            python3-pip
          
          pip install --upgrade pip
          pip install buildozer cython

      - name: Prepare main.py
        run: |
          if [ -f "main.py" ]; then
            echo "✅ main.py found"
          elif [ -f "calculator.py" ]; then
            cp calculator.py main.py
          else
            echo "❌ Error: No Python file found!"
            echo "Creating a simple main.py..."
            cat > main.py << 'EOF'
import sys
from PySide6.QtWidgets import QApplication, QMainWindow, QPushButton, QVBoxLayout, QWidget, QLabel

class MainWindow(QMainWindow):
    def __init__(self):
        super().__init__()
        self.setWindowTitle("Calculator")
        self.setGeometry(100, 100, 300, 200)
        
        central_widget = QWidget()
        self.setCentralWidget(central_widget)
        layout = QVBoxLayout()
        central_widget.setLayout(layout)
        
        label = QLabel("PySide6 Calculator")
        label.setStyleSheet("font-size: 20px; font-weight: bold;")
        layout.addWidget(label)
        
        button = QPushButton("Click Me")
        button.clicked.connect(lambda: label.setText("Button Clicked!"))
        layout.addWidget(button)

if __name__ == "__main__":
    app = QApplication(sys.argv)
    window = MainWindow()
    window.show()
    sys.exit(app.exec())
EOF
          fi

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Calculator
          package.name = calculator
          package.domain = org.example
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3==3.9.0,pyside6==6.6.0
          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 1.9.1
          fullscreen = 0
          android.minapi = 21
          android.api = 31
          android.ndk = 23b
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Buildozer
        run: |
          echo "Building APK..."
          buildozer android debug || echo "Buildozer build failed"
          echo "Build completed"

      - name: Debug build output
        run: |
          echo "Current directory contents:"
          ls -la
          echo ""
          echo "Bin directory:"
          ls -la bin/ 2>/dev/null || echo "No bin directory"
          echo ""
          echo "Build directory:"
          ls -la .buildozer/ 2>/dev/null || echo "No buildozer directory"
          echo ""
          echo "Looking for APK files:"
          find . -name "*.apk" -type f

      - name: Upload APK if found
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          if-no-files-found: warn
