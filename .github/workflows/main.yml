name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.10.3"
  APP_NAME: "calculator"
  ENTRY_POINT: "calculator.py"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Pre-install Android SDK components
        run: |
          echo "Pre-installing required SDK components with modern cmdline-tools..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Fix Buildozer sdkmanager (Prevent XML parsing hang)
        run: |
          echo "Replacing broken legacy 'tools/bin/sdkmanager' with a CI-safe dummy..."
          rm -rf $ANDROID_HOME/tools
          mkdir -p $ANDROID_HOME/tools/bin
          cat << 'EOF' > $ANDROID_HOME/tools/bin/sdkmanager
#!/bin/bash
# Dummy sdkmanager for buildozer in CI environments.
# We pre-install all required components, so we just report them as installed.
if [[ "$*" == *"--list"* ]] || [[ "$*" == *"--update"* ]]; then
  echo "Installed packages:"
  echo "  platform-tools"
  echo "  platforms;android-34"
  echo "  build-tools;34.0.0"
  echo "  ndk;27.0.12077973"
  echo "  cmake;3.22.1"
else
  echo "Dummy sdkmanager executed with: $*"
fi
exit 0
EOF
          chmod +x $ANDROID_HOME/tools/bin/sdkmanager
          echo "✅ Dummy sdkmanager created successfully."

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git unzip zip autoconf automake libtool pkg-config libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyside6==${{ env.PYSIDE_VERSION }} buildozer cython jinja2 pkginfo tqdm

      - name: Download PySide6 Android wheels
        run: |
          mkdir -p wheels
          cd wheels
          curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"
          curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"
          ls -lh *.whl

      - name: Prepare main.py
        run: |
          cp "${{ env.ENTRY_POINT }}" main.py
          echo "✅ Created main.py"

      - name: Build APK
        id: build
        run: |
          set -e
          set -o pipefail
          
          echo "=== تنظیمات محیطی قبل از ساخت ==="
          echo "Java version: $(java -version 2>&1 | head -n 1)"
          echo "Python: $(python --version)"
          
          # تغییر به جاوا ۸ برای سازگاری بهتر با برخی اسکریپت‌های قدیمی buildozer
          export JAVA_HOME=/usr/lib/jvm/temurin-8-jdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          echo "🔧 Switched Java to: $(java -version 2>&1 | head -n 1)"
          
          echo "=== شروع فرآیند pyside6-android-deploy ==="
          
          pyside6-android-deploy --force --verbose \
            --sdk-path="$ANDROID_HOME" \
            --ndk-path="$ANDROID_NDK_HOME" \
            --wheel-pyside="wheels/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="wheels/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --name="${{ env.APP_NAME }}"
          
          echo "✅ فرآیند ساخت تکمیل شد."

      - name: Find APK
        id: find_apk
        run: |
          echo "🔍 Searching for APK..."
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/wheels/*" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ هیچ فایل APK ساخته نشد."
            echo "📂 ساختار پوشه‌ها:"
            find . -maxdepth 3 -type d | grep -v "\.git/"
            exit 1
          fi
          
          echo "✅ APK successfully found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
