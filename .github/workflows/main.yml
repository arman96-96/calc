name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-11-jdk \
            autoconf libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake \
            libffi-dev libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6==6.6.0
          pip install python-for-android
          pip install cython==0.29.33

      - name: Verify PySide6 installation
        run: |
          python -c "import PySide6; print(f'PySide6 version: {PySide6.__version__}')"

      - name: Prepare main.py
        run: |
          if [ -f "main.py" ]; then
            echo "✅ main.py found"
          elif [ -f "calculator.py" ]; then
            cp calculator.py main.py
          else
            echo "❌ Error: main.py not found!"
            exit 1
          fi

      - name: Create .p4a config
        run: |
          cat > build_apk.py << 'EOF'
          from pythonforandroid import entrypoints
          from pythonforandroid.build import build_apk
          from pythonforandroid.recipe import Recipe
          from pythonforandroid.toolchain import ToolchainCL
          
          # این کد را اجرا می‌کنیم تا APK ساخته شود
          import os
          
          cmd = [
              "apk",
              "--bootstrap", "sdl2",
              "--requirements", "python3,pyside6==6.6.0",
              "--android-api", "31",
              "--ndk-api", "21",
              "--ndk-dir", "/tmp/ndk",
              "--sdk-dir", "/tmp/sdk",
              "--dist-name", "calculator",
              "--package", "org.example.calculator",
              "--name", "Calculator",
              "--version", "1.0",
              "--permission", "INTERNET",
              "--permission", "VIBRATE",
              "--dir", "."
          ]
          
          # اجرای دستور از طریق python-for-android
          import subprocess
          result = subprocess.run(["p4a"] + cmd, capture_output=True, text=True)
          print(result.stdout)
          if result.stderr:
              print(result.stderr)
          EOF

      - name: Download Android NDK and SDK
        run: |
          # Download Android NDK
          mkdir -p /tmp/ndk /tmp/sdk
          cd /tmp/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          mv android-ndk-r25c/* .
          rm -rf android-ndk-r25c android-ndk-r25c-linux.zip
          
          # Download Android SDK
          cd /tmp/sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip
          
          echo "ANDROID_NDK_HOME=/tmp/ndk" >> $GITHUB_ENV
          echo "ANDROID_SDK_HOME=/tmp/sdk" >> $GITHUB_ENV

      - name: Build APK with python-for-android
        run: |
          export ANDROID_NDK_HOME=/tmp/ndk
          export ANDROID_SDK_HOME=/tmp/sdk
          export PATH=$ANDROID_SDK_HOME/cmdline-tools/bin:$ANDROID_SDK_HOME/platform-tools:$PATH
          
          # نصب ابزارهای SDK
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-31"
          
          # ساخت APK
          p4a apk --bootstrap sdl2 \
            --requirements python3,pyside6==6.6.0 \
            --android-api 31 \
            --ndk-api 21 \
            --ndk-dir /tmp/ndk \
            --sdk-dir /tmp/sdk \
            --dist-name ${{ env.APP_NAME }} \
            --package org.example.${{ env.APP_NAME }} \
            --name "Calculator" \
            --version 1.0 \
            --permission INTERNET \
            --permission VIBRATE \
            --dir . \
            --debug

      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f -exec ls -lh {} \;
          mkdir -p artifacts
          find . -name "*.apk" -type f -exec cp {} artifacts/ \;
          
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "❌ No APK found. Trying to find build logs..."
            find . -name "*.log" -exec cat {} \;
          else
            echo "✅ APK files found!"
            ls -la artifacts/
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: artifacts/*.apk
          if-no-files-found: warn
