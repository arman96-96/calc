name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.8.0.2"
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6==${{ env.PYSIDE_VERSION }}
          pip install buildozer cython

      - name: Verify PySide6 installation
        run: |
          python -c "import PySide6; print(f'PySide6 version: {PySide6.__version__}')"
          python -c "from PySide6.QtCore import qVersion; print(f'Qt version: {qVersion()}')"

      - name: Prepare main.py
        run: |
          if [ -f "main.py" ]; then
            echo "✅ main.py found"
          elif [ -f "calculator.py" ]; then
            echo "📁 Copying calculator.py to main.py"
            cp calculator.py main.py
          else
            echo "❌ Error: Neither main.py nor calculator.py found!"
            echo "Files in current directory:"
            ls -la
            exit 1
          fi

      - name: Download Android wheels
        run: |
          mkdir -p wheels
          cd wheels
          
          echo "Downloading wheels for cp311..."
          curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" || true
          curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" || true
          
          if [ ! -f "PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" ]; then
            echo "cp311 wheels not found, trying cp310..."
            curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp310-cp310-android_aarch64.whl"
            curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp310-cp310-android_aarch64.whl"
          fi
          
          cd ..
          ls -la wheels/

      - name: Build APK
        env:
          VIRTUAL_ENV: "/tmp/fake_venv"
        run: |
          PYSIDE_WHEEL=$(ls wheels/PySide6-*.whl 2>/dev/null | head -n 1)
          SHIBOKEN_WHEEL=$(ls wheels/shiboken6-*.whl 2>/dev/null | head -n 1)
          
          if [ -z "$PYSIDE_WHEEL" ] || [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "Error: Wheel files not found!"
            ls -la wheels/
            exit 1
          fi
          
          echo "Using wheels:"
          echo "PySide: $PYSIDE_WHEEL"
          echo "Shiboken: $SHIBOKEN_WHEEL"
          
          pyside6-android-deploy --force \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --name="${{ env.APP_NAME }}" \
            --entrypoint="main.py" \
            --verbose

      - name: List generated files
        run: |
          echo "Current directory contents:"
          ls -la
          echo ""
          echo "Looking for APK files:"
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: |
            **/bin/*.apk
            **/dist/*.apk
            **/*.apk
          if-no-files-found: warn
