name: Build Android APK
on: [workflow_dispatch, push]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython
      
      - name: Create app
        run: |
          if [ ! -f main.py ]; then
            echo "from kivy.app import App
          from kivy.uix.button import Button
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          
          class MyApp(App):
              def build(self):
                  layout = BoxLayout(orientation='vertical')
                  btn = Button(text='Hello World')
                  layout.add_widget(btn)
                  return layout
          
          MyApp().run()" > main.py
          fi
      
      - name: Create spec
        run: |
          echo "[app]
          title = MyApp
          package.name = myapp
          package.domain = org.example
          source.dir = .
          version = 0.1
          requirements = python3==3.9.0,kivy==2.2.1
          android.api = 31
          android.ndk = 23b
          android.minapi = 21
          
          [buildozer]
          log_level = 2" > buildozer.spec
      
      - name: Build
        run: buildozer android debug
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
