name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip libgl1-mesa-dev libgl1-mesa-glx
          python -m pip install --upgrade pip
          pip install pyside6==6.6.0

      - name: Verify PySide6 installation
        run: |
          python -c "import PySide6; print(f'PySide6 version: {PySide6.__version__}')"

      - name: Prepare main.py
        run: |
          if [ -f "main.py" ]; then
            echo "✅ main.py found"
          elif [ -f "calculator.py" ]; then
            cp calculator.py main.py
          else
            echo "❌ Error: main.py not found!"
            exit 1
          fi

      - name: Create deployment config
        run: |
          cat > deploy.cfg << 'EOF'
          [project]
          name = ${{ env.APP_NAME }}
          entry_point = main.py
          
          [android]
          android_api_level = 33
          ndk_version = 25.1.8937393
          
          [qt]
          version = 6.6.0
          EOF

      - name: Build APK with pyside6-deploy
        run: |
          echo "Building APK using pyside6-deploy..."
          pyside6-deploy --android --name="${{ env.APP_NAME }}" main.py || echo "First attempt failed, trying alternative..."
          
          # اگر روش اول کار نکرد
          if [ ! -f "*.apk" ]; then
            echo "Trying alternative method..."
            python -c "
import sys
sys.path.insert(0, '/opt/hostedtoolcache/Python/3.9.21/x64/lib/python3.9/site-packages')
from PySide6.scripts import android_deploy
import os
os.chdir('.')
android_deploy.main()
" || true
          fi

      - name: Create buildozer.spec (alternative method)
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Calculator
          package.name = calculator
          package.domain = org.example
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,pyside6
          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 1.9.1
          fullscreen = 0
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Try build with buildozer
        run: |
          echo "Trying buildozer as alternative..."
          buildozer android debug || echo "Buildozer failed, but we'll check for APK anyway"

      - name: Find all APK files
        run: |
          echo "Searching for APK files..."
          echo "Current directory:"
          ls -la
          echo ""
          echo "Searching everywhere:"
          find . -name "*.apk" -type f -exec ls -lh {} \;
          echo ""
          echo "Build directories:"
          find . -type d -name "build*" -o -name "deploy*" -o -name "android*" | head -20
          
          # جمع‌آوری APKها
          mkdir -p artifacts
          find . -name "*.apk" -type f -exec cp {} artifacts/ \;
          
          # اگر APKی پیدا نشد، لاگ کامل نمایش بده
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "❌ No APK files found!"
            echo "=== Build logs ==="
            find . -name "*.log" -exec echo "=== {} ===" \; -exec cat {} \;
          else
            echo "✅ APK files found!"
            ls -la artifacts/
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: artifacts/*.apk
          if-no-files-found: warn
