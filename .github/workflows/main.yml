name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.8.0.0"
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Debug python/pip
        run: |
          set -e
          which python
          python -V
          which pip
          pip -V
          python -m pip -V

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install PySide6 (with full logs)
        run: |
          set -e
          pip install -v "pyside6==${{ env.PYSIDE_VERSION }}"

      - name: Verify install (show details)
        run: |
          set -e
          python -m pip show pyside6
          python -m pip list | grep -i pyside || true

      - name: Verify pyside6 import
        run: |
          set -e
          python -c "import pyside6; print('pyside6', pyside6.__version__)"
