name: Build Android APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake wget
          pip install --upgrade pip
          pip install buildozer cython
      
      - name: Create main.py
        run: |
          cat > main.py << 'EOF'
          from kivy.app import App
          from kivy.uix.button import Button
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          
          class CalculatorApp(App):
              def build(self):
                  layout = BoxLayout(orientation='vertical', padding=20, spacing=10)
                  self.label = Label(text='Calculator', font_size='30sp')
                  layout.add_widget(self.label)
                  
                  for i in range(1, 10):
                      btn = Button(text=str(i), size_hint_y=None, height=50)
                      btn.bind(on_press=self.on_button_press)
                      layout.add_widget(btn)
                  
                  return layout
              
              def on_button_press(self, instance):
                  self.label.text = f'Pressed: {instance.text}'
          
          if __name__ == '__main__':
              CalculatorApp().run()
          EOF
      
      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Calculator
          package.name = calculator
          package.domain = org.example
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3==3.9.0,kivy==2.2.1
          orientation = portrait
          fullscreen = 0
          android.api = 31
          android.ndk = 23b
          android.minapi = 21
          android.accept_sdk_license = True
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
      
      - name: Build APK with detailed logging
        run: |
          # اجرای buildozer با گرفتن لاگ کامل
          buildozer android debug --verbose 2>&1 | tee build_full.log
          exit_code=${PIPESTATUS[0]}
          
          if [ $exit_code -ne 0 ]; then
            echo "Build failed with exit code: $exit_code"
            echo "=== Full build log ==="
            cat build_full.log
            exit $exit_code
          fi
      
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build_full.log
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          if-no-files-found: warn
