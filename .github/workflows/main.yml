name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.8.0.1"
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6==${{ env.PYSIDE_VERSION }}

      - name: List repo Python files (debug)
        run: |
          ls -la
          find . -maxdepth 3 -type f -name "*.py" -print

      - name: Download Android wheels (check URLs first)
        run: |
          set -e
          mkdir -p wheels

          P="${{ env.PYSIDE_VERSION }}"
          U1="https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${P}-${P}-cp311-cp311-android_aarch64.whl"
          U2="https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${P}-${P}-cp311-cp311-android_aarch64.whl"

          echo "Testing wheel URLs..."
          curl -I -fL "$U1"
          curl -I -fL "$U2"

          echo "Downloading wheels..."
          cd wheels
          curl -fLO "$U1"
          curl -fLO "$U2"

      - name: Build APK
        env:
          VIRTUAL_ENV: "/tmp/fake_venv"
        run: |
          pyside6-android-deploy --force \
            --wheel-pyside="wheels/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="wheels/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --name="${{ env.APP_NAME }}"

      - name: List generated files
        run: ls -R

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: |
            **/dist/*.apk
            **/*.apk
