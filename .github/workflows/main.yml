name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.10.3"
  APP_NAME: "calculator"
  ENTRY_POINT: "calculator.py"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git unzip zip autoconf automake libtool pkg-config libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyside6==${{ env.PYSIDE_VERSION }} buildozer cython jinja2 pkginfo tqdm

      - name: Download PySide6 Android wheels
        run: |
          mkdir -p wheels
          cd wheels
          
          echo "=== دانلود فایل PySide6 ==="
          curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"
          
          echo "=== دانلود فایل Shiboken6 ==="
          curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"
          
          echo ""
          echo "=== بررسی فایل‌های دانلود شده ==="
          ls -lh *.whl
          
          # ✅ بررسی اینکه فایل‌ها واقعاً دانلود شده‌اند
          if [ ! -f "PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" ]; then
            echo "❌ خطا: فایل PySide6 دانلود نشد!"
            exit 1
          fi
          
          if [ ! -f "shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" ]; then
            echo "❌ خطا: فایل shiboken6 دانلود نشد!"
            exit 1
          fi
          
          echo "✅ هر دو فایل با موفقیت دانلود شدند"

      - name: Prepare main.py
        run: |
          cp "${{ env.ENTRY_POINT }}" main.py
          echo "✅ Created main.py from calculator.py"

      - name: Build APK
        run: |
          set -x # نمایش تمام دستورات
          
          echo "=== شروع فرآیند ساخت APK ==="
          echo "Python version: $(python --version)"
          echo "pyside6-android-deploy location: $(which pyside6-android-deploy)"
          echo ""
          
          # ✅ تلاش برای build با --force
          pyside6-android-deploy --force \
            --wheel-pyside="wheels/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="wheels/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --name="${{ env.APP_NAME }}" 2>&1 | tee build_log.txt
          
          BUILD_EXIT_CODE=$?
          echo ""
          echo "=== Build exit code: $BUILD_EXIT_CODE ==="
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed! Full log:"
            cat build_log.txt
            exit 1
          fi
          
          echo "✅ Build completed successfully"

      - name: Debug and Find APK
        id: find_apk
        run: |
          echo "🔍 Searching for APK files..."
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/wheels/*" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: No APK file was generated!"
            echo "📂 Full directory structure:"
            find . -type f -name "*.apk" -o -name "*.aab" -o -type d -name "android-build" -o -type d -name "build"
            echo ""
            echo "📂 Current directory contents:"
            ls -laR . | head -100
            exit 1
          fi
          
          echo "✅ Successfully found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
