name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.10.3"
  APP_NAME: "calculator"
  ENTRY_POINT: "calculator.py"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git unzip zip autoconf automake libtool pkg-config libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyside6==${{ env.PYSIDE_VERSION }} buildozer cython jinja2 pkginfo tqdm

      - name: Download PySide6 Android wheels
        run: |
          mkdir -p wheels
          cd wheels
          curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"
          curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"

      - name: Prepare main.py
        run: |
          cp "${{ env.ENTRY_POINT }}" main.py
          echo "Created main.py from calculator.py"

      - name: Build APK
        env:
          VIRTUAL_ENV: "/tmp/fake_venv"
        run: |
          pyside6-android-deploy \
            --wheel-pyside="wheels/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="wheels/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --name="${{ env.APP_NAME }}"

      # ✅ مرحله‌ی جدید و هوشمند برای پیدا کردن و دیباگ فایل APK
      - name: Debug and Find APK
        id: find_apk
        run: |
          echo "🔍 Searching for APK files in the entire workspace..."
          find . -type f -name "*.apk"
          
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/wheels/*" -not -path "*/venv/*" -not -path "*/build_env/*" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: No APK file was generated!"
            echo "📂 Here is the directory structure to help debug:"
            ls -la
            echo "📂 Checking android-build directory (if it exists):"
            ls -laR android-build 2>/dev/null || echo "No android-build directory found."
            exit 1
          fi
          
          echo "✅ Successfully found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
