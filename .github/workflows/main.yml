name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.8.0.0"
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install PySide6 (fail fast)
        run: |
          set -e
          pip install -v "pyside6==${{ env.PYSIDE_VERSION }}"

      - name: Show installed packages (debug)
        run: |
          python -m pip show pyside6 || true
          python -m pip list | grep -i pyside || true

      - name: Verify pyside6 import
        run: |
          set -e
          python -c "import pyside6; print('pyside6', pyside6.__version__)"

      - name: Download Android wheels (try cp310/cp311)
        run: |
          set -e
          mkdir -p wheels

          P="${{ env.PYSIDE_VERSION }}"

          for CP in cp310 cp311; do
            U1="https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${P}-${P}-${CP}-${CP}-android_aarch64.whl"
            U2="https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${P}-${P}-${CP}-${CP}-android_aarch64.whl"

            echo "Testing CP=${CP}"
            if curl -I -fL "$U1" >/dev/null 2>&1 && curl -I -fL "$U2" >/dev/null 2>&1; then
              echo "Found wheels with CP=${CP}"
              cd wheels
              curl -fLO "$U1"
              curl -fLO "$U2"
              cd ..
              exit 0
            fi
          done

          echo "Could not find matching PySide6+shiboken6 android_aarch64 wheels for version $P (tried cp310/cp311)."
          exit 1

      - name: Build APK
        env:
          VIRTUAL_ENV: "/tmp/fake_venv"
        run: |
          set -e
          pyside_wheel="$(ls -1 wheels/PySide6-*.whl | head -n 1)"
          shiboken_wheel="$(ls -1 wheels/shiboken6-*.whl | head -n 1)"

          echo "Using wheels:"
          echo "$pyside_wheel"
          echo "$shiboken_wheel"

          pyside6-android-deploy --force \
            --wheel-pyside="$pyside_wheel" \
            --wheel-shiboken="$shiboken_wheel" \
            --name="${{ env.APP_NAME }}" \
            --entrypoint="main.py"

      - name: List generated files
        run: ls -R

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: |
            **/dist/*.apk
            **/*.apk
