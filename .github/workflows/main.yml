name: Build Kivy APK

on:
  push:
    branches:
      - main   # یا master، بسته به نام شاخه اصلی ریپازیتوری شما
  workflow_dispatch: # اجازه می‌دهد به صورت دستی هم بیلد را اجرا کنید

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-pip \
            python3-setuptools \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good
          pip install --upgrade pip virtualenv
          pip install buildozer cython==3.0.11

      - name: Build APK with Buildozer
        run: |
          # اجرای بیلد. گزینه debug برای تست کافی است
          # اگر می‌خواهید برای انتشار بسازید از android release استفاده کنید
          buildozer android debug
        env:
          # پذیرش خودکار لایسنس‌های اندروید برای جلوگیری از توقف بیلد
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-App-APK
          path: bin/*.apk
          retention-days: 7
