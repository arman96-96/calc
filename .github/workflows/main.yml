name: Build Android APK

# اجرای دستی از تب Actions یا خودکار روی هر push به main
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  # نسخه PySide6/Qt که هم wheel اندرویدی دارد و هم با pyside6-android-deploy سازگار است
  PYSIDE_VERSION: "6.10.3"
  APP_NAME: "calculator"
  # نام واقعی فایل برنامه‌ی شما در ریپو - اگر نامش چیز دیگری است همین را تغییر دهید
  SOURCE_FILE: "calculator.py"

jobs:
  build-apk:
    # این کار فقط روی لینوکس اجرا می‌شود
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git unzip zip \
            autoconf automake libtool pkg-config \
            libffi-dev libssl-dev

      - name: Create virtual environment
        run: |
          python -m venv .venv
          # اضافه کردن bin مربوط به venv به PATH برای همه‌ی مراحل بعدی این job
          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          # این متغیر همان چیزی است که ابزار deploy برای تشخیص venv بررسی می‌کند
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> "$GITHUB_ENV"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyside6==${{ env.PYSIDE_VERSION }} buildozer cython

      - name: Install pyside6-android-deploy requirements
        run: |
          # این پکیج‌ها را خود اسکریپت deploy می‌خواهد و به‌صورت پیش‌فرض نصب نیستند
          REQ_FILE=$(python -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'scripts', 'requirements-android.txt'))")
          echo "Requirements file: $REQ_FILE"
          pip install -r "$REQ_FILE"

      - name: Prepare entry point as main.py
        run: |
          # pyside6-android-deploy به‌طور پیش‌فرض دنبال main.py می‌گردد
          # و آرگومانی برای مشخص کردن نام فایل ورودی ندارد
          if [ "${SOURCE_FILE}" != "main.py" ]; then
            cp "${SOURCE_FILE}" main.py
          fi

      - name: Download PySide6 / shiboken6 Android wheels (arm64-v8a)
        run: |
          mkdir -p wheels
          cd wheels
          curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          ls -la

      - name: Build APK with pyside6-android-deploy
        run: |
          pyside6-android-deploy \
            --force \
            --wheel-pyside="wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            --name="${APP_NAME}"

      - name: Locate generated APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -not -path "*/wheels/*" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
