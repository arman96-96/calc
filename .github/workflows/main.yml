name: Build Android APK with Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Prepare main.py
        run: |
          if [ -f "main.py" ]; then
            echo "✅ main.py found"
          elif [ -f "calculator.py" ]; then
            cp calculator.py main.py
          else
            echo "Error: main.py not found!"
            exit 1
          fi

      - name: Build APK with Docker
        run: |
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            ghcr.io/mjovanc/pyside6-android:latest \
            bash -c "
            apt-get update && apt-get install -y python3-pip
            pip3 install pyside6==6.6.0
            pyside6-deploy --android --name='${{ env.APP_NAME }}' main.py
            "

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -name "*.apk" -type f -exec ls -lh {} \;
          mkdir -p artifacts
          find . -name "*.apk" -type f -exec cp {} artifacts/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: artifacts/*.apk
          if-no-files-found: warn
