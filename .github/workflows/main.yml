name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.8.0.0"
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Debug python/pip
        run: |
          set -e
          which python
          python -V
          which pip
          pip -V
          python -m pip -V

      - name: Upgrade pip
        run: |
          set -e
          python -m pip install --upgrade pip

      - name: Install PySide6 + verify immediately (single step)
        run: |
          set -euo pipefail
          echo "Installing: pyside6==${{ env.PYSIDE_VERSION }}"
          python -m pip install -v "pyside6==${{ env.PYSIDE_VERSION }}"

          echo "pip show:"
          python -m pip show pyside6 || true

          echo "Installed pyside-related packages:"
          python -m pip list | grep -i pyside || true

          echo "Python executable:"
          python -c "import sys; print(sys.executable)"

          echo "Trying import..."
          python -c "import pyside6; print('pyside6', pyside6.__version__)"
        
      - name: Download Android wheels (try cp310/cp311)
        run: |
          set -e
          mkdir -p wheels
          P="${{ env.PYSIDE_VERSION }}"

          for CP in cp310 cp311; do
            echo "Trying CP=${CP}"
            U1="https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${P}-${P}-${CP}-${CP}-android_aarch64.whl"
            U2="https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${P}-${P}-${CP}-${CP}-android_aarch64.whl"

            if curl -I -fL "$U1" >/dev/null 2>&1 && curl -I -fL "$U2" >/dev/null 2>&1; then
              echo "Found wheels with CP=${CP}"
              cd wheels
              curl -fLO "$U1"
              curl -fLO "$U2"
              cd ..
              break
            fi
          done

          ls -la wheels

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build APK
        env:
          VIRTUAL_ENV: "/tmp/fake_venv"
        run: |
          set -e
          pyside_wheel="$(ls -1 wheels/PySide6-*.whl | head -n 1)"
          shiboken_wheel="$(ls -1 wheels/shiboken6-*.whl | head -n 1)"

          echo "Using wheels:"
          echo "$pyside_wheel"
          echo "$shiboken_wheel"

          pyside6-android-deploy --force \
            --wheel-pyside="$pyside_wheel" \
            --wheel-shiboken="$shiboken_wheel" \
            --name="${{ env.APP_NAME }}" \
            --entrypoint="main.py"

      - name: List generated files
        run: ls -R

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: |
            **/dist/*.apk
            **/*.apk
