name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk
          python -m pip install --upgrade pip
          pip install pyside6==6.7.1
          pip install buildozer cython

      - name: Verify PySide6 installation
        run: |
          python -c "import PySide6; print(f'PySide6 version: {PySide6.__version__}')"

      - name: Prepare main.py
        run: |
          if [ -f "main.py" ]; then
            echo "✅ main.py found"
          elif [ -f "calculator.py" ]; then
            cp calculator.py main.py
          else
            echo "❌ Error: main.py not found!"
            exit 1
          fi

      - name: Install Android SDK and NDK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_NDK_ROOT=$HOME/android-ndk
          
          # Download Android SDK
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip
          
          # Install SDK components
          yes | ./cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-33" "build-tools;33.0.0" "platform-tools"
          
          # Download Android NDK
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          rm android-ndk-r25c-linux.zip
          
          echo "Android SDK and NDK installed"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build with pyside6-android-deploy
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_NDK_ROOT=$HOME/android-ndk-r25c
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          
          # Find the tool
          PYSIDE_TOOL=$(which pyside6-android-deploy 2>/dev/null || find /opt/hostedtoolcache/Python -name "pyside6-android-deploy" 2>/dev/null | head -1)
          
          if [ -z "$PYSIDE_TOOL" ]; then
            echo "pyside6-android-deploy not found! Trying alternative..."
            PYSIDE_TOOL=$(find ~/.local -name "pyside6-android-deploy" 2>/dev/null | head -1)
          fi
          
          echo "Using tool: $PYSIDE_TOOL"
          
          if [ -n "$PYSIDE_TOOL" ]; then
            $PYSIDE_TOOL --force \
              --name="${{ env.APP_NAME }}" \
              --entrypoint="main.py" \
              --verbose
          else
            echo "pyside6-android-deploy not found. Trying to use python -m..."
            python -m PySide6.scripts.android_deploy --force \
              --name="${{ env.APP_NAME }}" \
              --entrypoint="main.py" \
              --verbose
          fi

      - name: Find and upload APK
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f -exec ls -lh {} \;
          
          # Create a directory for artifacts
          mkdir -p artifacts
          find . -name "*.apk" -type f -exec cp {} artifacts/ \;
          
          if [ -z "$(ls -A artifacts)" ]; then
            echo "No APK files found!"
            echo "Build directory contents:"
            ls -laR .
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: artifacts/*.apk
          if-no-files-found: warn
