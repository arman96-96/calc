name: Build Android APK
on: 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake \
            libffi-dev libssl-dev
      
      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install buildozer cython
      
      - name: Create main.py if not exists
        run: |
          if [ ! -f "main.py" ]; then
            cat > main.py << 'EOF'
          from kivy.app import App
          from kivy.uix.button import Button
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.textinput import TextInput
          
          class CalculatorApp(App):
              def build(self):
                  layout = BoxLayout(orientation='vertical', spacing=10, padding=20)
                  
                  self.display = TextInput(text='0', font_size='30sp', readonly=True)
                  layout.add_widget(self.display)
                  
                  buttons = [
                      ['7', '8', '9', '/'],
                      ['4', '5', '6', '*'],
                      ['1', '2', '3', '-'],
                      ['0', '.', '=', '+']
                  ]
                  
                  for row in buttons:
                      row_layout = BoxLayout(spacing=5)
                      for label in row:
                          btn = Button(text=label, size_hint_y=None, height=60)
                          btn.bind(on_press=self.on_button_press)
                          row_layout.add_widget(btn)
                      layout.add_widget(row_layout)
                  
                  return layout
              
              def on_button_press(self, instance):
                  current = self.display.text
                  text = instance.text
                  
                  if text == '=':
                      try:
                          result = eval(current)
                          self.display.text = str(result)
                      except:
                          self.display.text = 'Error'
                  else:
                      if current == '0' and text != '.':
                          self.display.text = text
                      else:
                          self.display.text = current + text
          
          if __name__ == '__main__':
              CalculatorApp().run()
          EOF
            echo "✅ Created main.py"
          else
            echo "✅ main.py already exists"
          fi
      
      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Calculator
          package.name = calculator
          package.domain = org.example
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3==3.9.0,kivy==2.2.1
          orientation = portrait
          fullscreen = 0
          android.api = 31
          android.ndk = 23b
          android.minapi = 21
          android.gradle_dependencies = 
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
EOF
      
      - name: Build APK
        run: |
          echo "Starting build process..."
          buildozer android debug || echo "Build failed with exit code $?"
      
      - name: List build artifacts
        run: |
          echo "=== Directory contents ==="
          ls -la
          echo ""
          echo "=== Bin directory ==="
          ls -la bin/ 2>/dev/null || echo "No bin directory yet"
          echo ""
          echo "=== Buildozer directory ==="
          ls -la .buildozer/ 2>/dev/null || echo "No .buildozer directory"
          echo ""
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          if-no-files-found: warn
