name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.10.3"
  APP_NAME: "calculator"
  ENTRY_POINT: "calculator.py"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git unzip zip autoconf automake libtool pkg-config libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyside6==${{ env.PYSIDE_VERSION }} buildozer cython jinja2 pkginfo tqdm

      - name: Download PySide6 Android wheels
        run: |
          mkdir -p wheels
          cd wheels
          curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"
          curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"
          ls -lh *.whl

      - name: Prepare main.py
        run: |
          cp "${{ env.ENTRY_POINT }}" main.py
          ls -la main.py

      # ✅ مرحله Build با روش قطعی برای پاسخ به سوال تعاملی
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -x
          echo "=== Starting build ==="
          echo "Python: $(which python)"
          echo "pyside6-android-deploy: $(which pyside6-android-deploy)"
          echo "SDK: $ANDROID_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          
          # ✅ پاسخ خودکار به سوال تعاملی با echo "Y"
          echo "Y" | pyside6-android-deploy --force \
            --sdk-path="$ANDROID_HOME" \
            --ndk-path="$ANDROID_NDK_HOME" \
            --wheel-pyside="wheels/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="wheels/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --name="${{ env.APP_NAME }}"
          
          echo "Exit code: $?"

      # ✅ مرحله دیباگ: همیشه اجرا می‌شود حتی اگر build شکست بخورد
      - name: Debug - Show all files
        if: always()
        run: |
          echo "=== تمام فایل‌ها و پوشه‌های ساخته شده ==="
          find . -maxdepth 3 -type d | grep -v "\.git/"
          echo ""
          echo "=== فایل‌های APK/AAB ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null || echo "هیچ فایل APK/AAB پیدا نشد"

      - name: Find and Upload APK
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ هیچ APK ساخته نشد!"
            echo "لطفاً لاگ مرحله 'Build APK' را بررسی کنید."
            exit 1
          fi
          
          echo "✅ APK found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
