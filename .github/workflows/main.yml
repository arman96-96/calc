name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.7.1"  # نسخه پایدارتر با پشتیبانی اندروید
  APP_NAME: "calculator"

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6==${{ env.PYSIDE_VERSION }}
          pip install buildozer cython

      - name: Verify PySide6 installation
        run: |
          python -c "import PySide6; print(f'PySide6 version: {PySide6.__version__}')"
          python -c "from PySide6.QtCore import qVersion; print(f'Qt version: {qVersion()}')"

      - name: Prepare main.py
        run: |
          if [ -f "main.py" ]; then
            echo "✅ main.py found"
          elif [ -f "calculator.py" ]; then
            echo "📁 Copying calculator.py to main.py"
            cp calculator.py main.py
          else
            echo "❌ Error: Neither main.py nor calculator.py found!"
            echo "Files in current directory:"
            ls -la
            exit 1
          fi

      - name: Download Android wheels
        run: |
          mkdir -p wheels
          cd wheels
          
          # فرمت صحیح URL برای نسخه 6.7.1
          # برای Python 3.11
          PYSIDE_WHEEL="PySide6-6.7.1-6.7.1-cp311-cp311-android_aarch64.whl"
          SHIBOKEN_WHEEL="shiboken6-6.7.1-6.7.1-cp311-cp311-android_aarch64.whl"
          
          echo "Trying to download: $PYSIDE_WHEEL"
          curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/$PYSIDE_WHEEL" || echo "Failed to download $PYSIDE_WHEEL"
          curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/$SHIBOKEN_WHEEL" || echo "Failed to download $SHIBOKEN_WHEEL"
          
          # اگر نسخه 6.7.1 کار نکرد، نسخه 6.6.0 را امتحان کن
          if [ ! -f "$PYSIDE_WHEEL" ]; then
            echo "Trying version 6.6.0..."
            PYSIDE_WHEEL="PySide6-6.6.0-6.6.0-cp311-cp311-android_aarch64.whl"
            SHIBOKEN_WHEEL="shiboken6-6.6.0-6.6.0-cp311-cp311-android_aarch64.whl"
            
            curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/$PYSIDE_WHEEL" || echo "Failed to download $PYSIDE_WHEEL"
            curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/$SHIBOKEN_WHEEL" || echo "Failed to download $SHIBOKEN_WHEEL"
          fi
          
          # اگر باز هم کار نکرد، برای Python 3.10 امتحان کن
          if [ ! -f "$PYSIDE_WHEEL" ]; then
            echo "Trying Python 3.10 version..."
            PYSIDE_WHEEL="PySide6-6.6.0-6.6.0-cp310-cp310-android_aarch64.whl"
            SHIBOKEN_WHEEL="shiboken6-6.6.0-6.6.0-cp310-cp310-android_aarch64.whl"
            
            curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/$PYSIDE_WHEEL" || echo "Failed to download $PYSIDE_WHEEL"
            curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/$SHIBOKEN_WHEEL" || echo "Failed to download $SHIBOKEN_WHEEL"
          fi
          
          cd ..
          echo "Wheels directory contents:"
          ls -la wheels/

      - name: Build APK
        env:
          VIRTUAL_ENV: "/tmp/fake_venv"
        run: |
          PYSIDE_WHEEL=$(ls wheels/PySide6-*.whl 2>/dev/null | head -n 1)
          SHIBOKEN_WHEEL=$(ls wheels/shiboken6-*.whl 2>/dev/null | head -n 1)
          
          if [ -z "$PYSIDE_WHEEL" ] || [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "❌ Error: Wheel files not found!"
            echo "Available files in wheels/:"
            ls -la wheels/
            exit 1
          fi
          
          echo "✅ Using wheels:"
          echo "PySide: $PYSIDE_WHEEL"
          echo "Shiboken: $SHIBOKEN_WHEEL"
          
          pyside6-android-deploy --force \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --name="${{ env.APP_NAME }}" \
            --entrypoint="main.py" \
            --verbose

      - name: List generated files
        run: |
          echo "Current directory contents:"
          ls -la
          echo ""
          echo "Looking for APK files:"
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: |
            **/bin/*.apk
            **/dist/*.apk
            **/*.apk
          if-no-files-found: warn
