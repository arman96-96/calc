      - name: Find available Android wheels on Qt server
        run: |
          set -e
          mkdir -p wheels

          P="${{ env.PYSIDE_VERSION }}"

          echo "Fetching directory listing..."
          # اگر لیست‌گیری ممنوع باشد، این مرحله fail می‌شود و باید روش بعدی را بریم.
          PAGE="$(curl -sL https://download.qt.io/official_releases/QtForPython/pyside6/ || true)"
          echo "$PAGE" | head -n 5

          echo "Searching for PySide6 wheel for android_aarch64..."
          # این grep نام‌هایی مثل ...android_aarch64....whl را پیدا می‌کند
          echo "$PAGE" | grep -E "PySide6-${P}-${P}-(cp[0-9]{2})-\\1-android_aarch64\\.whl" || true

          echo "Available shiboken6 wheels check..."
          PAGE2="$(curl -sL https://download.qt.io/official_releases/QtForPython/shiboken6/ || true)"
          echo "$PAGE2" | grep -E "shiboken6-${P}-${P}-(cp[0-9]{2})-\\1-android_aarch64\\.whl" || true

          echo "Now update workflow with the exact wheel filenames found above."
