name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYSIDE_VERSION: "6.10.3"
  APP_NAME: "calculator"
  ENTRY_POINT: "calculator.py"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git unzip zip autoconf automake libtool pkg-config libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyside6==${{ env.PYSIDE_VERSION }} buildozer cython jinja2 pkginfo tqdm

      - name: Download PySide6 Android wheels
        run: |
          mkdir -p wheels
          cd wheels
          # ✅ اصلاح نهایی: نام فایل‌ها در سرور Qt با حروف بزرگ شروع می‌شوند (PySide6 و Shiboken6)
          curl -fLO "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"
          curl -fLO "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl"
          
          echo "✅ فایل‌های دانلود شده:"
          ls -lh *.whl

      - name: Prepare main.py
        run: |
          cp "${{ env.ENTRY_POINT }}" main.py
          echo "Created main.py from calculator.py"

      - name: Build APK
        run: |
          set -x # نمایش تمام دستورات اجرایی برای دیباگ دقیق
          set -e # توقف فوری در صورت بروز هرگونه خطا
          
          echo "=== شروع فرآیند ساخت APK ==="
          # ✅ استفاده از --force برای رد کردن سوال محیط مجازی به روش رسمی و استاندارد
          pyside6-android-deploy --force --verbose \
            --wheel-pyside="wheels/PySide6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="wheels/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-cp311-cp311-android_aarch64.whl" \
            --name="${{ env.APP_NAME }}"
          
          echo "=== فرآیند ساخت به پایان رسید ==="

      - name: Debug and Find APK
        id: find_apk
        run: |
          echo "🔍 جستجو برای فایل APK..."
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/wheels/*" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ خطا: هیچ فایل APK ساخته نشد!"
            echo "📂 ساختار پوشه‌ها برای بررسی:"
            ls -laR . | grep -E "(\.apk|android-build|buildozer)" || echo "هیچ پوشه مرتبطی پیدا نشد."
            exit 1
          fi
          
          echo "✅ فایل APK با موفقیت پیدا شد: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
